name: Weekly E2E Test

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual triggering

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # keepalive commit
      issues: write # failure notification

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Commit only when the repo has actually gone quiet, so an
      # actively developed repo never sees these commits at all.
      - name: Keepalive commit if repository is idle
        run: |
          idle_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was $idle_days days ago"
          if [ "$idle_days" -ge 45 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m "chore: keepalive (idle ${idle_days}d)"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm test
        env:
          BASE_URL: https://kodekur.ru

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 E2E Test Failed - Weekly Check',
              body: 'The weekly E2E test has failed. Please check the workflow run for details.',
              labels: ['bug', 'test-failure'],
              assignees: ['ubnt-natalia']
            });
